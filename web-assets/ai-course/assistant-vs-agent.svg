<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI 助理 vs AI Agent</title>
  <desc id="desc">白底科技藍與淡紫色的 AI 入門課程資訊圖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d8e6f7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="42" fill="url(#grid)" opacity=".65"/>
  <circle cx="1024" cy="116" r="82" fill="#ede9fe" opacity=".88"/>
  <circle cx="176" cy="560" r="74" fill="#dbeafe" opacity=".9"/>
  <text x="72" y="104" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="42" font-weight="900" fill="#132238">AI 助理 vs AI Agent</text>
  <rect x="72" y="132" width="210" height="10" rx="5" fill="#2563eb"/>
  
    <rect x="110" y="238" width="410" height="230" rx="36" fill="#ffffff" stroke="#c9dcf6" stroke-width="3"/>
    <rect x="680" y="238" width="410" height="230" rx="36" fill="#ffffff" stroke="#d9ccff" stroke-width="3"/>
    <text x="315" y="314" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#2563eb">回一句</text>
    <text x="885" y="314" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="38" font-weight="900" fill="#7c3aed">用工具</text>
    <text x="315" y="386" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" fill="#64748b">走流程</text>
    <text x="885" y="372" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" fill="#64748b">交結果</text>
    <text x="885" y="414" text-anchor="middle" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="27" fill="#64748b">整理</text>
    <text x="600" y="372" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="900" fill="#132238">VS</text>
</svg>
