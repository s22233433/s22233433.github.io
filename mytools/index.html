<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tools | ZhenguoCool</title>
  <meta name="description" content="ZhenguoCool 的實用工具與教學備課頁。">
  <style>
    :root {
      --ink: #1d1b16;
      --muted: #6e675c;
      --paper: #fbfaf5;
      --line: #d9d0c2;
      --blue: #2f5f98;
      --green: #34785d;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(29, 27, 22, .04) 1px, transparent 1px),
        linear-gradient(rgba(29, 27, 22, .04) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 72px;
    }

    header {
      padding-bottom: 28px;
      border-bottom: 3px solid var(--ink);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 8vw, 88px);
      line-height: .95;
      letter-spacing: 0;
    }

    .intro {
      margin: 16px 0 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 30px;
    }

    .card {
      display: grid;
      gap: 10px;
      min-height: 210px;
      padding: 22px;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 0 rgba(29, 27, 22, .06);
      text-decoration: none;
    }

    .card:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .card h2 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }

    .tag {
      align-self: end;
      width: max-content;
      padding: 4px 9px;
      color: var(--paper);
      background: var(--blue);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 720px) {
      main { width: min(100% - 22px, 960px); padding-top: 28px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">ZhenguoCool / My Tools</p>
      <h1>實用工具目錄</h1>
      <p class="intro">這裡放不影響官網首頁的獨立工具、教學備課和臨時頁面。</p>
    </header>

    <section class="grid" aria-label="工具列表">
      <a class="card" href="/mytools/ai-teaching-flow/">
        <h2>AI 入門教學流程</h2>
        <p>90 分鐘一對一教學備課：工具選擇、Windows 底座、自訂指令、實作流程、檢查清單。</p>
        <span class="tag">教學備課</span>
      </a>
    </section>

    <footer>
      回到官網首頁：<a href="/">zhenguocool.com</a>
    </footer>
  </main>
</body>
</html>
